# Render "Blueprint" for the LIVE dashboard (free plan).
# Render builds the root Dockerfile: a FastAPI server that reads the warehouse
# hosted on Neon. DATABASE_URL is asked for when the Blueprint is created
# (sync: false = the value is typed in Render, never written in this file).
# The free plan sleeps after 15 minutes without visits: the first load can take
# about a minute. See docs/DEPLOIEMENT.md.
services:
  - type: web
    name: retail-warehouse-live
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
