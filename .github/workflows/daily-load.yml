# Live demo: every morning, simulate the new business day, load it into the
# warehouse hosted on Neon (ingest -> dbt build -> reconcile), then publish the
# fresh dashboard data to GitHub Pages. This plays the role of the Airflow DAG
# for the online version (same code: python -m retail_pipeline.run live-update).
#
# Needs one repository secret: NEON_DATABASE_URL (Settings > Secrets and
# variables > Actions). Without it the job stops at the first step and does nothing.
name: Daily load (live demo)

on:
  schedule:
    - cron: "30 5 * * *"   # every day at 05:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      # the live company: smaller than the local demo so that a full year
      # fits in the free Neon storage (0.5 GB)
      SIM_START_DATE: "2026-09-01"
      SIM_STORES: "4"
      SIM_PRODUCTS: "120"
      SIM_SUPPLIERS: "10"
      SIM_PLAN_DAYS: "365"
      SIM_SEED: "42"
    steps:
      - name: Check that the database secret exists
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret NEON_DATABASE_URL is missing (see docs/DEPLOIEMENT.md)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Simulate and load the new day(s), dbt build, reconcile, export
        run: python -m retail_pipeline.run live-update
      - name: Publish the fresh dashboard data
        run: bash scripts/publish_pages.sh --fresh
