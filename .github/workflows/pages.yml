# Publishes the dashboard (dashboard/static) to the gh-pages branch when its code
# changes. GitHub Pages serves that branch at
# https://cheugs.github.io/Retail-Inventory-or-and-Supply-Chain-Warehouse/
# The data already online is kept (it is refreshed every day by daily-load.yml).
name: Publish dashboard

on:
  push:
    branches: [main]
    paths: ["dashboard/static/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish dashboard/static to gh-pages
        run: bash scripts/publish_pages.sh
